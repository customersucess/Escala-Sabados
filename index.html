<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <script>
      // Aplica o tema antes da primeira pintura para evitar o flash de tema errado.
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem('sempre-tema');
        } catch (erro) {}
        if (tema !== 'claro' && tema !== 'escuro') {
          tema = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        }
        document.documentElement.dataset.tema = tema;
      })();
    </script>
    <meta
      name="description"
      content="Organize a escala de sábados do time de Sucesso do Cliente da Sempre Tecnologia."
    />
    <link rel="icon" href="/favicon.svg" />
    <title>Escala de Sábados | Sempre Tecnologia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
